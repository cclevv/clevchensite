    <script>
        const EMOJIS = ['🎉','🎂','🎈','⭐','💝','📚','✏️','⚽','🎨','🎵','🌟','💪','🏆','🎯','❤️','😊','🌈','🦄','🐶','🐱','🌸','🌺','☀️','🌙','✈️','🏠','🏫','🛝','🕯️','🍞','🍷','👧','👦','👨‍👩‍👧‍👦'];
        const TAGS = ['אבא','אמא','יום הולדת','חופש','רופא','ספורט','מסיבה','טיול','בית ספר','חג','משפחה','חברים','ארוע'];
        const TAG_COLORS = {
            'אבא': '#5b8db8',
            'אמא': '#c2727a',
            'יום הולדת': '#d4874e',
            'חופש': '#5a9e96',
            'רופא': '#c97070',
            'ספורט': '#6aaa7a',
            'מסיבה': '#d4874e',
            'טיול': '#5a9e96',
            'בית ספר': '#5b8db8',
            'חג': '#c2727a',
            'משפחה': '#6aaa7a',
            'חברים': '#5a9e96',
            'ארוע': '#5b8db8'
        };
        const COLORS = ['#fce4e4','#d6ecf5','#daf0df','#f5edce','#f5d6e0','#e8d8f0','#f5dcc0','#d0ebe6','#f5e2cc','#e2f0d8','#f2f2f2','#ffffff'];
        const DAY_HEADERS = ['א\'', 'ב\'', 'ג\'', 'ד\'', 'ה\'', 'ו\'', 'ש\''];
        const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
        const SEASON_EMOJIS = {
            winter: ['❄️','⛄','☃️'],
            spring: ['🌸','🌺','🌼'],
            summer: ['☀️','🌞','🏖️'],
            fall: ['🍂','🍁','🎃']
        };
        const TIME_SLOTS = [
            { key: 'morning', label: 'בוקר', emoji: '🌅' },
            { key: 'afterMorning', label: 'אחרי הבוקר', emoji: '☀️' },
            { key: 'noon', label: 'צהריים', emoji: '🌞' },
            { key: 'afterNoon', label: 'אחה״צ', emoji: '🌤️' },
            { key: 'evening', label: 'ערב', emoji: '🌆' },
            { key: 'night', label: 'לילה', emoji: '🌙' }
        ];
        let dayData = {};
        let weeklyTasks = {};
        let selectedDays = new Set();
        let lastSelectedDate = null;
        let editingDates = [];
        let viewMode = 'month'; // 'month', 'week', or 'day'
        let currentWeekStart = null;
        let currentMonth = new Date();
        let currentDay = new Date();
        let hasUnsavedChanges = false;
        function markUnsaved() {
            hasUnsavedChanges = true;
            document.getElementById('unsavedBadge').style.display = 'block';
        }
        function markSaved() {
            hasUnsavedChanges = false;
            document.getElementById('unsavedBadge').style.display = 'none';
        }
        window.addEventListener('beforeunload', function(e) {
            if (hasUnsavedChanges) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
        function getWeekKey(date) {
            const d = new Date(date);
            d.setDate(d.getDate() - d.getDay());
            return `${d.getFullYear()}-W${String(Math.ceil(d.getDate() / 7)).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }
        function migrateData() {
            for (let date in dayData) {
                if (dayData[date].emoji && !dayData[date].emojiTop) {
                    dayData[date].emojiTop = Array.isArray(dayData[date].emoji) ? dayData[date].emoji : [dayData[date].emoji];
                    delete dayData[date].emoji;
                }
                if (!dayData[date].emojiTop) dayData[date].emojiTop = [];
                if (!dayData[date].emojiBottom) dayData[date].emojiBottom = [];
                if (!dayData[date].events) dayData[date].events = [];
                if (!dayData[date].tags) dayData[date].tags = [];
            }
        }
        function getSeason(month) {
            if (month >= 11 || month <= 1) return 'winter';
            if (month >= 2 && month <= 4) return 'spring';
            if (month >= 5 && month <= 7) return 'summer';
            return 'fall';
        }
        function generateCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const monthTitle = document.getElementById('monthTitle');
            monthTitle.textContent = `${MONTHS[month]} ${year}`;
            const monthContainer = document.createElement('div');
            monthContainer.className = 'month-container';
            const season = getSeason(month);
            const seasonEmojis = SEASON_EMOJIS[season].join(' ');
            const monthHeader = document.createElement('div');
            monthHeader.className = `month-header ${season}`;
            monthHeader.textContent = `${MONTHS[month]} ${year}`;
            monthContainer.appendChild(monthHeader);
            const daysGrid = document.createElement('div');
            daysGrid.className = 'days-grid';
            DAY_HEADERS.forEach(header => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = header;
                daysGrid.appendChild(dayHeader);
            });
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                daysGrid.appendChild(emptyCell);
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';
                dayCell.dataset.date = dateStr;
                dayCell.onclick = handleDayClick;
                updateDayCell(dayCell, dateStr, day);
                daysGrid.appendChild(dayCell);
            }
            monthContainer.appendChild(daysGrid);
            if (Object.keys(dayData).length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-state-hint';
                hint.textContent = 'לחץ על יום כדי להוסיף אירועים, תגיות ועוד';
                monthContainer.appendChild(hint);
            }
            grid.appendChild(monthContainer);
        }
        function updateDayCell(cell, dateStr, dayNum) {
            const data = dayData[dateStr] || {};
            const color = data.color || '#ffffff';
            cell.style.backgroundColor = color;
            let html = `<div class="day-number">${dayNum}</div>`;
            let itemCount = 0;
            const maxItems = 3;
            let totalItems = 0;
            if (data.tags) totalItems += data.tags.length;
            if (data.events) totalItems += data.events.length;
            const slotEvents = getTimeSlotEvents(dateStr);
            totalItems += slotEvents.length;
            if (data.emojiTop && data.emojiTop.length > 0) totalItems++;
            if (data.note) totalItems++;
            if (data.tags && data.tags.length > 0 && itemCount < maxItems) {
                html += '<div class="day-tags">';
                data.tags.forEach((tag) => {
                    const bgColor = TAG_COLORS[tag] || '#7a8a9e';
                    html += `<span class="day-tag" style="background: ${bgColor}">${tag}</span>`;
                });
                html += '</div>';
                itemCount++;
            }
            if (data.emojiTop && data.emojiTop.length > 0 && itemCount < maxItems) {
                html += `<div class="day-emoji-top">${data.emojiTop.join(' ')}</div>`;
                itemCount++;
            }
            if (data.emojiBottom && data.emojiBottom.length > 0 && itemCount < maxItems) {
                html += `<div class="day-emoji-bottom">${data.emojiBottom.join(' ')}</div>`;
                itemCount++;
            }

                    selectedDays.delete(dateStr);
                } else {
                    selectedDays.add(dateStr);
                }
                lastSelectedDate = dateStr;
                updateSelection();

                const allDates = Array.from(document.querySelectorAll('.day-cell[data-date], .week-day-container[data-date]')).map(cell => cell.dataset.date);
                const startIdx = allDates.indexOf(lastSelectedDate);
                const endIdx = allDates.indexOf(dateStr);
                const [minIdx, maxIdx] = [Math.min(startIdx, endIdx), Math.max(startIdx, endIdx)];
                for (let i = minIdx; i <= maxIdx; i++) {
                    selectedDays.add(allDates[i]);
                }
                updateSelection();
            } else {
                if (selectedDays.size > 0) {
                    selectedDays.clear();
                    updateSelection();
                    if (selectedDays.has(dateStr)) {
                        openEditModal([dateStr]);
                        return;
                    }
                }
                if (selectedDays.has(dateStr) && selectedDays.size > 1) {

                    canvas.width = w;

        function rgbToHex(rgb) {
            if (rgb.startsWith('#')) return rgb;
            const match = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);

            const r = parseInt(match[1]);
            const g = parseInt(match[2]);
            const b = parseInt(match[3]);
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

            weekView.className = 'week-view';
            const weekDates = getWeekDates(currentWeekStart);
            const startDate = weekDates[0];
            const endDate = weekDates[6];
            const weekTitle = document.getElementById('weekTitle');
            weekTitle.textContent = `${startDate.getDate()} ${MONTHS[startDate.getMonth()]} ${startDate.getFullYear()} - ${endDate.getDate()} ${MONTHS[endDate.getMonth()]} ${endDate.getFullYear()}`;
            const season = getSeason(startDate.getMonth());
            const seasonEmojis = SEASON_EMOJIS[season].join(' ');
            const weekHeader = document.createElement('div');
            weekHeader.className = `month-header ${season}`;
            weekHeader.textContent = `${MONTHS[startDate.getMonth()]} ${startDate.getFullYear()}`;
            weekView.appendChild(weekHeader);
            const weekGrid = document.createElement('div');
            weekGrid.className = 'week-grid';
            weekDates.forEach((date, index) => {
                const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                const dayContainer = document.createElement('div');
                dayContainer.className = 'week-day-container';
                dayContainer.dataset.date = dateStr;
                dayContainer.onclick = handleDayClick;
                const data = dayData[dateStr] || {};
                const color = data.color || '#ffffff';
                dayContainer.style.backgroundColor = color;
                let html = `<div class="week-day-header">${DAY_HEADERS[index]}</div>`;
                html += `<div class="week-day-number">${date.getDate()}</div>`;
                if (data.tags && data.tags.length > 0) {
                    html += '<div class="week-day-tags">';
                    data.tags.forEach((tag) => {
                        const bgColor = TAG_COLORS[tag] || '#7a8a9e';
                        html += `<span class="week-day-tag" style="background: ${bgColor}">${tag}</span>`;
                    });
                    html += '</div>';
                }
                if (data.emojiTop && data.emojiTop.length > 0) {
                    html += `<div class="week-day-emoji-top">${data.emojiTop.join(' ')}</div>`;
                }
                if (data.emojiBottom && data.emojiBottom.length > 0) {
                    html += `<div class="week-day-emoji-bottom">${data.emojiBottom.join(' ')}</div>`;
                }
                if (data.note) {
                    html += `<div class="week-day-note">${data.note}</div>`;
                }
                if (data.events && data.events.length > 0) {
                    data.events.forEach((event, eventIndex) => {
                        html += `<div class="week-day-event">
                            <span>${event}</span>
                            <button class="delete-btn" onclick="deleteEvent(event, '${dateStr}', ${eventIndex})">×</button>
                        </div>`;
                    });
                }
                const slotEventsW = getTimeSlotEvents(dateStr);
                slotEventsW.forEach(ev => {
                    html += `<div class="week-day-event slot-event"><span>${ev}</span></div>`;
                });
                const allPhotosW = [...getTimeSlotPhotos(dateStr), ...(data.photos || [])];
                if (allPhotosW.length > 0) {
                    html += `<div class="week-day-photos">`;
                    allPhotosW.forEach(p => {
                        html += `<img class="week-day-photo" src="${p}" onclick="viewPhoto(this.src)">`;
                    });
                    html += `</div>`;
                }
                dayContainer.innerHTML = html;
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
                if (dateStr === todayStr) dayContainer.classList.add('today');
                if (selectedDays.has(dateStr)) {
                    dayContainer.classList.add('selected');
                }
                weekGrid.appendChild(dayContainer);
            });
            weekView.appendChild(weekGrid);
            const weekKey = getWeekKey(currentWeekStart);
            const tasks = weeklyTasks[weekKey] || [];
            const weeklyTasksSection = document.createElement('div');
            weeklyTasksSection.className = 'weekly-tasks';
            weeklyTasksSection.innerHTML = `
                <div class="weekly-tasks-header weekly-tasks-toggle" onclick="this.closest('.weekly-tasks').classList.toggle('collapsed')">📋 משימות שבועיות <span class="collapse-arrow">&#9660;</span></div>
                <input type="text" class="weekly-task-input" id="weeklyTaskInput" placeholder="הוסף משימה ולחץ Enter">
                <div id="weeklyTasksList"></div>
            `;
            weekView.appendChild(weeklyTasksSection);
            grid.appendChild(weekView);
            updateWeeklyTasksList(weekKey);
            document.getElementById('weeklyTaskInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.trim()) {
                    if (!weeklyTasks[weekKey]) weeklyTasks[weekKey] = [];
                    weeklyTasks[weekKey].push({ text: this.value.trim(), completed: false });
                    this.value = '';
                    updateWeeklyTasksList(weekKey);
                    markUnsaved();
                }
            });
        }
        function updateWeeklyTasksList(weekKey) {
            const list = document.getElementById('weeklyTasksList');
            if (!list) return;
            list.innerHTML = '';
            const tasks = weeklyTasks[weekKey] || [];
            tasks.forEach((task, index) => {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'weekly-task-item';
                taskDiv.innerHTML = `
                    <input type="checkbox" class="weekly-task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleWeeklyTask('${weekKey}', ${index})">
                    <span class="weekly-task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                    <button class="delete-btn" onclick="deleteWeeklyTask(event, '${weekKey}', ${index})">×</button>
                `;
                list.appendChild(taskDiv);
            });
        }
        function toggleWeeklyTask(weekKey, index) {
            if (weeklyTasks[weekKey] && weeklyTasks[weekKey][index]) {
                weeklyTasks[weekKey][index].completed = !weeklyTasks[weekKey][index].completed;
                updateWeeklyTasksList(weekKey);
            }
        }
        function deleteWeeklyTask(e, weekKey, index) {
            e.stopPropagation();
            if (weeklyTasks[weekKey]) {
                weeklyTasks[weekKey].splice(index, 1);
                updateWeeklyTasksList(weekKey);
            }
        }
        function previousWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            generateWeekView();
        }
        function nextWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            generateWeekView();
        }
        function updateWeekDayCell(dateStr) {
            const container = document.querySelector(`.week-day-container[data-date="${dateStr}"]`);
            if (!container) return;
            const date = new Date(dateStr);
            const dayOfWeek = date.getDay();
            const data = dayData[dateStr] || {};
            const color = data.color || '#ffffff';
            container.style.backgroundColor = color;
            let html = `<div class="week-day-header">${DAY_HEADERS[dayOfWeek]}</div>`;
            html += `<div class="week-day-number">${date.getDate()}</div>`;
            if (data.tags && data.tags.length > 0) {
                html += '<div class="week-day-tags">';
                data.tags.forEach((tag) => {
                    const bgColor = TAG_COLORS[tag] || '#7a8a9e';
                    html += `<span class="week-day-tag" style="background: ${bgColor}">${tag}</span>`;
                });
                html += '</div>';
            }
            if (data.emojiTop && data.emojiTop.length > 0) {
                html += `<div class="week-day-emoji-top">${data.emojiTop.join(' ')}</div>`;
            }
            if (data.emojiBottom && data.emojiBottom.length > 0) {
                html += `<div class="week-day-emoji-bottom">${data.emojiBottom.join(' ')}</div>`;
            }
            if (data.note) {
                html += `<div class="week-day-note">${data.note}</div>`;
            }
            if (data.events && data.events.length > 0) {
                data.events.forEach((event, index) => {
                    html += `<div class="week-day-event">
                        <span>${event}</span>
                        <button class="delete-btn" onclick="deleteEvent(event, '${dateStr}', ${index})">×</button>
                    </div>`;
                });
            }
            const slotEventsU = getTimeSlotEvents(dateStr);
            slotEventsU.forEach(ev => {
                html += `<div class="week-day-event slot-event"><span>${ev}</span></div>`;
            });
            const allPhotosU = [...getTimeSlotPhotos(dateStr), ...(data.photos || [])];
            if (allPhotosU.length > 0) {
                html += `<div class="week-day-photos">`;
                allPhotosU.forEach(p => {
                    html += `<img class="week-day-photo" src="${p}" onclick="viewPhoto(this.src)">`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
            if (selectedDays.has(dateStr)) {
                container.classList.add('selected');
            } else {
                container.classList.remove('selected');
            }
        }
        function generateDayView() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const dateStr = `${currentDay.getFullYear()}-${String(currentDay.getMonth() + 1).padStart(2, '0')}-${String(currentDay.getDate()).padStart(2, '0')}`;
            const dayTitle = document.getElementById('dayTitle');
            const dayOfWeek = DAY_HEADERS[currentDay.getDay()];
            dayTitle.textContent = `${dayOfWeek} ${currentDay.getDate()} ${MONTHS[currentDay.getMonth()]} ${currentDay.getFullYear()}`;
            const season = getSeason(currentDay.getMonth());
            const seasonEmojis = SEASON_EMOJIS[season].join(' ');
            const dailyView = document.createElement('div');
            dailyView.className = 'daily-view';
            const data = dayData[dateStr] || {};
            const infoStrip = document.createElement('div');
            infoStrip.className = 'daily-day-info';
            infoStrip.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:8px;cursor:pointer;min-height:36px;';
            infoStrip.onclick = () => openEditModal([dateStr]);
            let stripHtml = '';
            if (data.tags && data.tags.length > 0) {
                data.tags.forEach(tag => {
                    const bgColor = TAG_COLORS[tag] || '#7a8a9e';
                    stripHtml += `<span class="day-tag" style="background:${bgColor};font-size:11px;padding:3px 8px;">${tag}</span>`;
                });
            }
            if (data.emojiTop && data.emojiTop.length > 0) stripHtml += `<span style="font-size:18px">${data.emojiTop.join(' ')}</span>`;
            if (data.emojiBottom && data.emojiBottom.length > 0) stripHtml += `<span style="font-size:18px">${data.emojiBottom.join(' ')}</span>`;
            if (data.note) stripHtml += `<span style="color:#666;font-size:13px">${data.note}</span>`;
            if (!stripHtml) stripHtml = '<span class="daily-edit-btn" style="color:#667eea;font-size:13px">+ עריכת יום</span>';
            infoStrip.innerHTML = stripHtml;
            dailyView.appendChild(infoStrip);
            if (!data.timeSlots) {
                if (!dayData[dateStr]) dayData[dateStr] = { emojiTop: [], emojiBottom: [], events: [], tags: [] };
                dayData[dateStr].timeSlots = {};
                TIME_SLOTS.forEach(s => dayData[dateStr].timeSlots[s.key] = []);
            }
            const slotsGrid = document.createElement('div');
            slotsGrid.className = 'time-slots-grid';
            TIME_SLOTS.forEach(slot => {
                const box = document.createElement('div');
                box.className = 'time-slot-box';
                box.dataset.slot = slot.key;
                const slotEvents = data.timeSlots ? (data.timeSlots[slot.key] || []) : [];
                let html = `<div class="time-slot-header">${slot.emoji} ${slot.label}</div>`;
                slotEvents.forEach((ev, idx) => {
                    html += `<div class="time-slot-event">
                        <span>${ev}</span>
                        <button class="delete-btn" onclick="deleteTimeSlotEvent('${dateStr}','${slot.key}',${idx})">×</button>
                    </div>`;
                });
                const slotPhotos = data.timeSlots ? (data.timeSlots[slot.key + '_photos'] || []) : [];
                slotPhotos.forEach((photo, idx) => {
                    html += `<div class="time-slot-photo-container">
                        <img class="time-slot-photo" src="${photo}" onclick="viewPhoto(this.src)">
                        <button class="delete-btn" onclick="deleteTimeSlotPhoto('${dateStr}','${slot.key}',${idx})">×</button>
                    </div>`;
                });
                html += `<input class="time-slot-input" placeholder="+ הוסף" data-date="${dateStr}" data-slot="${slot.key}">`;
                html += `<label class="time-slot-upload-btn">📷 תמונה<input type="file" accept="image/*" style="display:none" data-date="${dateStr}" data-slot="${slot.key}" onchange="handlePhotoUpload(this)"></label>`;
                box.innerHTML = html;
                slotsGrid.appendChild(box);
            });
            dailyView.appendChild(slotsGrid);
            grid.appendChild(dailyView);
            document.querySelectorAll('.time-slot-input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter' && this.value.trim()) {
                        const d = this.dataset.date;
                        const s = this.dataset.slot;
                        if (!dayData[d]) dayData[d] = { emojiTop: [], emojiBottom: [], events: [], tags: [], timeSlots: {} };
                        if (!dayData[d].timeSlots) dayData[d].timeSlots = {};
                        if (!dayData[d].timeSlots[s]) dayData[d].timeSlots[s] = [];
                        dayData[d].timeSlots[s].push(this.value.trim());
                        this.value = '';
                        markUnsaved();
                        generateDayView();
                    }
                });
            });
        }
        function handlePhotoUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const dateStr = input.dataset.date;
            const slotKey = input.dataset.slot;
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'photo-loading';
            loadingDiv.textContent = 'טוען תמונה...';
            input.closest('.time-slot-box').appendChild(loadingDiv);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 800;
                    let w = img.width, h = img.height;
                    if (w > maxSize || h > maxSize) {
                        if (w > h) { h = h * maxSize / w; w = maxSize; }
                        else { w = w * maxSize / h; h = maxSize; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const base64 = canvas.toDataURL('image/jpeg', 0.7);
                    if (!dayData[dateStr]) dayData[dateStr] = { emojiTop: [], emojiBottom: [], events: [], tags: [], timeSlots: {} };
                    if (!dayData[dateStr].timeSlots) dayData[dateStr].timeSlots = {};
                    const photoKey = slotKey + '_photos';
                    if (!dayData[dateStr].timeSlots[photoKey]) dayData[dateStr].timeSlots[photoKey] = [];
                    dayData[dateStr].timeSlots[photoKey].push(base64);
                    markUnsaved();
                    generateDayView();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        function deleteTimeSlotPhoto(dateStr, slotKey, index) {
            const photoKey = slotKey + '_photos';
            if (dayData[dateStr] && dayData[dateStr].timeSlots && dayData[dateStr].timeSlots[photoKey]) {
                dayData[dateStr].timeSlots[photoKey].splice(index, 1);
                generateDayView();
            }
        }
        function viewPhoto(src) {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:3000;display:flex;align-items:center;justify-content:center;cursor:pointer;';
            overlay.innerHTML = `<img src="${src}" style="max-width:90%;max-height:90%;border-radius:8px;">`;
            overlay.onclick = () => overlay.remove();
            document.body.appendChild(overlay);
        }
        function deleteTimeSlotEvent(dateStr, slotKey, index) {
            if (dayData[dateStr] && dayData[dateStr].timeSlots && dayData[dateStr].timeSlots[slotKey]) {
                dayData[dateStr].timeSlots[slotKey].splice(index, 1);
                generateDayView();
            }
        }
        function previousDay() {
            currentDay.setDate(currentDay.getDate() - 1);
            generateDayView();
        }
        function nextDay() {
            currentDay.setDate(currentDay.getDate() + 1);
            generateDayView();
        }
        function getTimeSlotEvents(dateStr) {
            const data = dayData[dateStr];
            if (!data || !data.timeSlots) return [];
            const merged = [];
            TIME_SLOTS.forEach(slot => {
                const events = data.timeSlots[slot.key] || [];
                events.forEach(ev => {
                    merged.push(`${slot.emoji} ${ev}`);
                });
            });
            return merged;
        }
        function getTimeSlotPhotos(dateStr) {
            const data = dayData[dateStr];
            if (!data || !data.timeSlots) return [];
            const photos = [];
            TIME_SLOTS.forEach(slot => {
                const slotPhotos = data.timeSlots[slot.key + '_photos'] || [];
                slotPhotos.forEach(p => photos.push(p));
            });
            return photos;
        }
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeModal();
            }
            if (!event.target.closest('.export-dropdown')) {
                closeExportMenu();
            }
        };
        migrateData();
        generateCalendar();
    </script>
</body>
</html>
